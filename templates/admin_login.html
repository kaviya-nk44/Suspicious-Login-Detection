<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suspicious Login Detection - Security Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="portal-container">
        <!-- Header -->
        <div class="portal-header">
            <h2>AI-Based Suspicious Login Detection System</h2>
            <p class="portal-subtitle">Security Admin Authentication</p>
        </div>

        <!-- Flash / Status Alert Message -->
        {% if error %}
        <div class="alert alert-danger">
            <strong>{{ error }}</strong>
        </div>
        {% endif %}

        <!-- Clean Admin Login Card -->
        <div class="login-card admin-login-card">
            <h3>Security Admin Login</h3>
            <form action="/admin-login" method="POST">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" placeholder="security_admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input type="password" id="password" name="password" placeholder="AdminSecure@2026" required>
                </div>
                <button type="submit" class="btn-login btn-admin-login">Authenticate Admin</button>
            </form>

            <div class="admin-link-container">
                <a href="/" class="nav-link">&larr; Back to User Login Portal</a>
            </div>
        </div>
    </div>
</body>
</html>
